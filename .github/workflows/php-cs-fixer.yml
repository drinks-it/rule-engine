name: PHP-CS-Fixer

on:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none
                    tools: composer:v2

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --no-interaction

            -   name: Run PHP-CS-Fixer
                run: composer php-cs
